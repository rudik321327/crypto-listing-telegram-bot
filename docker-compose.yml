services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/listings.db
      API_HOST: 0.0.0.0
      API_PORT: "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.64.0
    ports:
      - "5678:5678"
    environment:
      APP_URL: http://bot:8080
      API_TOKEN: ${API_TOKEN}
      GENERIC_TIMEZONE: UTC
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        n8n import:workflow --input=/workflows/listings.json &&
        n8n update:workflow --id=cryptoListings01 --active=true &&
        exec n8n start
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  n8n_data:
